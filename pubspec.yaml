name: household_finance_manager
description: Offline-first household finance app — multi-wallet expenses, assets & liabilities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.3
  fl_chart: ^1.3.1
  collection: ^1.19.1
  shared_preferences: ^2.5.6
  google_fonts: ^6.2.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  crypto: ^3.0.8
  decimal: ^3.2.6
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  package_info_plus: ^10.0.0
  file_picker: ^12.0.0
  share_plus: ^13.1.0
  encrypt: ^5.0.3
  csv: ^6.0.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#0B1F4B"
    theme_color: "#0D9488"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  image_path: assets/icon/app_icon.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_background: "#0B1F4B"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
